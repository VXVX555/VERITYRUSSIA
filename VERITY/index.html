<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Verity: Boiler Hunt</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    touch-action: none;
  }
  #hint {
    position: fixed;
    bottom: 10px;
    left: 20px;
    color: #fff;
    font-weight: bold;
    font-size: 18px;
    text-shadow: 2px 2px 0 #000;
    pointer-events: none;
    z-index: 5;
  }
  @media (max-width: 800px) {
    #hint { font-size: 12px; bottom: 6px; left: 10px; }
  }

  /* ---------- СКРИМЕР ---------- */
  #screamer {
    position: fixed;
    inset: 0;
    background: #000 center/cover no-repeat;
    display: none;
    z-index: 999;
  }

  /* ---------- СТАРТОВЫЙ ЭКРАН ---------- */
  #startScreen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 1000;
    cursor: pointer;
    padding: 20px;
  }
  #startScreen h1 { font-size: 42px; margin-bottom: 20px; color: #ffd700; }
  #startScreen p  { font-size: 18px; margin: 8px 0; opacity: 0.9; }
  #startScreen .big {
    font-size: 28px;
    margin-top: 40px;
    color: #4caf50;
    padding: 16px 36px;
    border: 3px solid #4caf50;
    border-radius: 12px;
    background: rgba(76, 175, 80, 0.15);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.06); opacity: 0.85; }
  }
  @media (max-width: 600px) {
    #startScreen h1 { font-size: 28px; }
    #startScreen p  { font-size: 14px; }
    #startScreen .big { font-size: 20px; padding: 12px 24px; }
  }

  /* ---------- ВИРТУАЛЬНЫЙ ДЖОЙСТИК ---------- */
  #joystick {
    position: fixed;
    left: 30px;
    bottom: 30px;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 3px solid rgba(255,255,255,0.35);
    z-index: 100;
    display: none;
    touch-action: none;
  }
  #joyKnob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: rgba(255, 215, 0, 0.75);
    border: 3px solid rgba(255,255,255,0.7);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 20px rgba(255,215,0,0.5);
    pointer-events: none;
  }
  /* Кнопка M (музыка) */
  #btnMusic {
    position: fixed;
    right: 30px;
    bottom: 30px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 3px solid rgba(255,255,255,0.4);
    color: #fff;
    font-size: 30px;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    font-weight: bold;
    touch-action: none;
  }
  @media (max-width: 800px) {
    #joystick { width: 130px; height: 130px; left: 20px; bottom: 20px; }
    #joyKnob  { width: 58px; height: 58px; }
    #btnMusic { width: 66px; height: 66px; font-size: 24px; right: 20px; bottom: 20px; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="hint">WASD / стрелки — движение, M — музыка, Esc — выход</div>
<div id="screamer"></div>

<!-- Мобильное управление -->
<div id="joystick"><div id="joyKnob"></div></div>
<div id="btnMusic">🎵</div>

<div id="startScreen">
  <h1>🟡 VERITY: BOILER HUNT 🔥</h1>
  <p>Собирай бойлеры, расти и стань огромным...</p>
  <p>Но помни: если станешь слишком большим — случится страшное.</p>
  <p class="big">▶ Нажми, чтобы начать</p>
</div>

<script>
/* =========================================================
   КОНФИГ
   ========================================================= */
const CONFIG = {
  PET_SIZE_BASE: 160,
  PET_GROW: 6,
  PET_SIZE_MAX: 800,
  BOILER_SIZE: 160,
  MAX_BOILERS: 6,
  RESPAWN_MS: 1500,
  SPEED: 8,
  SCREAMER_MS: 1000,

  IMG_PET:     "images-Photoroom (1).png",
  IMG_BOILER:  "images-Photoroom.png",
  IMG_SCREAM:  "images (1).jpg",
  SND_MUSIC:   "ia-veriti-ochen-strashnyi-monstr.mp3",
  SND_SCREAM:  "glitch-skrimer--tsifrovoy.mp3",
};

/* =========================================================
   CANVAS
   ========================================================= */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 200));
resize();

/* =========================================================
   ОПРЕДЕЛЕНИЕ ТАЧ-УСТРОЙСТВА
   ========================================================= */
const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;

/* =========================================================
   РЕСУРСЫ
   ========================================================= */
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject("Не загрузилось: " + src);
    img.src = src;
  });
}

let petOriginal = null;
let boilerImg   = null;
let screamImg   = null;

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
let pet = { x: 0, y: 0, size: CONFIG.PET_SIZE_BASE, img: null };
let boilers = [];
let score = 0;
let startTime = 0;
let music = null;
let screamSound = null;
let running = false;
let t = 0;

/* =========================================================
   УТИЛИТЫ
   ========================================================= */
function rand(min, max) { return Math.random() * (max - min) + min; }

function spawnBoiler() {
  for (let i = 0; i < 50; i++) {
    const x = rand(20, W - CONFIG.BOILER_SIZE - 20);
    const y = rand(20, H - CONFIG.BOILER_SIZE - 20);
    if (Math.abs(x - pet.x) > 260 || Math.abs(y - pet.y) > 260) {
      return { x, y, active: true, respawn: 0 };
    }
  }
  return {
    x: rand(20, W - CONFIG.BOILER_SIZE - 20),
    y: rand(20, H - CONFIG.BOILER_SIZE - 20),
    active: true, respawn: 0
  };
}

function initBoilers() {
  boilers = [];
  for (let i = 0; i < CONFIG.MAX_BOILERS; i++) boilers.push(spawnBoiler());
}

/* =========================================================
   ВВОД — КЛАВИАТУРА
   ========================================================= */
const keys = {};
window.addEventListener("keydown", (e) => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === "Escape") running = false;
  if (e.key.toLowerCase() === "m") toggleMusic();
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

/* =========================================================
   ВВОД — ВИРТУАЛЬНЫЙ ДЖОЙСТИК
   ========================================================= */
const joyEl   = document.getElementById("joystick");
const joyKnob = document.getElementById("joyKnob");

// Вектор движения от джойстика (нормализованный)
const joyVector = { x: 0, y: 0 };
let joyActive = false;
let joyTouchId = null;
let joyCenter = { x: 0, y: 0 };
const JOY_MAX_RADIUS = isTouch && window.innerWidth <= 800 ? 65 : 80;

function getJoyCenter() {
  const r = joyEl.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

joyEl.addEventListener("touchstart", (e) => {
  e.preventDefault();
  const touch = e.changedTouches[0];
  joyTouchId = touch.identifier;
  joyActive = true;
  joyCenter = getJoyCenter();
  updateJoy(touch.clientX, touch.clientY);
}, { passive: false });

joyEl.addEventListener("touchmove", (e) => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touch.identifier === joyTouchId) {
      updateJoy(touch.clientX, touch.clientY);
    }
  }
}, { passive: false });

function endJoy(e) {
  for (const touch of e.changedTouches) {
    if (touch.identifier === joyTouchId) {
      joyTouchId = null;
      joyActive = false;
      joyVector.x = 0; joyVector.y = 0;
      joyKnob.style.left = "50%";
      joyKnob.style.top  = "50%";
    }
  }
}
joyEl.addEventListener("touchend", endJoy);
joyEl.addEventListener("touchcancel", endJoy);

function updateJoy(tx, ty) {
  let dx = tx - joyCenter.x;
  let dy = ty - joyCenter.y;
  const dist = Math.hypot(dx, dy);

  if (dist > JOY_MAX_RADIUS) {
    dx = dx / dist * JOY_MAX_RADIUS;
    dy = dy / dist * JOY_MAX_RADIUS;
  }

  const nx = dx / JOY_MAX_RADIUS;
  const ny = dy / JOY_MAX_RADIUS;

  // Мёртвая зона 15%
  const dead = 0.15;
  if (Math.hypot(nx, ny) < dead) {
    joyVector.x = 0; joyVector.y = 0;
  } else {
    joyVector.x = nx;
    joyVector.y = ny;
  }

  // Двигаем визуальный кноб
  joyKnob.style.left = (50 + (dx / JOY_MAX_RADIUS) * 50) + "%";
  joyKnob.style.top  = (50 + (dy / JOY_MAX_RADIUS) * 50) + "%";
}

/* =========================================================
   МУЗЫКА
   ========================================================= */
function toggleMusic() {
  if (!music) return;
  if (music.paused) music.play().catch(()=>{});
  else music.pause();

  const btn = document.getElementById("btnMusic");
  if (btn) btn.textContent = music.paused ? "🔇" : "🎵";
}

document.getElementById("btnMusic").addEventListener("touchstart", (e) => {
  e.preventDefault();
  toggleMusic();
}, { passive: false });
document.getElementById("btnMusic").addEventListener("click", (e) => {
  e.preventDefault();
  toggleMusic();
});

/* =========================================================
   СКРИМЕР
   ========================================================= */
function playScreamer() {
  running = false;

  if (music) { try { music.pause(); } catch(e){} }
  if (screamSound) { try { screamSound.pause(); } catch(e){} }

  const scr = document.getElementById("screamer");
  if (screamImg) scr.style.backgroundImage = `url("${screamImg.src}")`;
  else scr.style.background = "red";
  scr.style.display = "block";

  if (screamSound) {
    screamSound.currentTime = 0;
    screamSound.volume = 1.0;
    screamSound.play().catch(e => console.warn("Скример-звук не проиграл:", e));
  }

  // Вибрация (если есть) — для пущего эффекта
  if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 600]);

  setTimeout(() => {
    window.close();
    scr.style.backgroundImage = "none";
    scr.style.background = "#000";
    document.getElementById("hint").style.display = "none";
    if (joyEl) joyEl.style.display = "none";
    if (document.getElementById("btnMusic")) document.getElementById("btnMusic").style.display = "none";
  }, CONFIG.SCREAMER_MS);
}

/* =========================================================
   АПДЕЙТ
   ========================================================= */
function update() {
  // Клавиатура
  let dx = 0, dy = 0;
  if (keys["arrowleft"]  || keys["a"]) dx -= 1;
  if (keys["arrowright"] || keys["d"]) dx += 1;
  if (keys["arrowup"]    || keys["w"]) dy -= 1;
  if (keys["arrowdown"]  || keys["s"]) dy += 1;

  // Джойстик
  if (joyVector.x !== 0 || joyVector.y !== 0) {
    dx = joyVector.x;
    dy = joyVector.y;
  }

  const mag = Math.hypot(dx, dy);
  if (mag > 1) { dx /= mag; dy /= mag; }

  pet.x += dx * CONFIG.SPEED;
  pet.y += dy * CONFIG.SPEED;

  pet.x = Math.max(0, Math.min(W - pet.size, pet.x));
  pet.y = Math.max(0, Math.min(H - pet.size, pet.y));

  // Хитбокс
  const margin = pet.size * 0.18;
  const pr = {
    x: pet.x + margin, y: pet.y + margin,
    w: pet.size - margin * 2, h: pet.size - margin * 2
  };

  const now = performance.now();
  for (const b of boilers) {
    if (b.active) {
      const hit =
        pr.x < b.x + CONFIG.BOILER_SIZE &&
        pr.x + pr.w > b.x &&
        pr.y < b.y + CONFIG.BOILER_SIZE &&
        pr.y + pr.h > b.y;

      if (hit) {
        b.active = false;
        b.respawn = now + CONFIG.RESPAWN_MS;
        score++;

        if (pet.size < CONFIG.PET_SIZE_MAX) {
          const cx = pet.x + pet.size / 2;
          const cy = pet.y + pet.size / 2;
          pet.size = Math.min(CONFIG.PET_SIZE_MAX, pet.size + CONFIG.PET_GROW);
          pet.x = cx - pet.size / 2;
          pet.y = cy - pet.size / 2;

          if (pet.size >= CONFIG.PET_SIZE_MAX && running) {
            playScreamer();
            return;
          }
        }
      }
    } else if (now >= b.respawn) {
      const nb = spawnBoiler();
      b.x = nb.x; b.y = nb.y; b.active = true;
    }
  }
}

/* =========================================================
   ОТРИСОВКА
   ========================================================= */
function drawFlagBackground() {
  const h3 = H / 3;
  ctx.fillStyle = "#fff";    ctx.fillRect(0, 0, W, h3);
  ctx.fillStyle = "#0039a6"; ctx.fillRect(0, h3, W, h3);
  ctx.fillStyle = "#d52b1e"; ctx.fillRect(0, h3 * 2, W, h3);
}

function drawUI() {
  ctx.save();
  const scale = Math.min(W, H) < 800 ? 0.6 : 1;

  ctx.textAlign = "right";

  // Счёт
  ctx.font = `bold ${48 * scale}px Arial`;
  ctx.fillStyle = "#000";
  ctx.fillText("Бойлеры: " + score, W - 27 * scale, 63 * scale);
  ctx.fillStyle = "#fff";
  ctx.fillText("Бойлеры: " + score, W - 30 * scale, 60 * scale);

  // Таймер
  const elapsed = Math.floor((performance.now() - startTime) / 1000);
  const mm = String(Math.floor(elapsed / 60)).padStart(2, "0");
  const ss = String(elapsed % 60).padStart(2, "0");
  const timeStr = `Время: ${mm}:${ss}`;

  ctx.font = `bold ${28 * scale}px Arial`;
  ctx.fillStyle = "#000";
  ctx.fillText(timeStr, W - 28 * scale, 113 * scale);
  ctx.fillStyle = "#fff";
  ctx.fillText(timeStr, W - 30 * scale, 110 * scale);

  // Размер
  const sizeStr = `Размер: ${Math.round(pet.size)}`;
  ctx.fillStyle = "#000";
  ctx.fillText(sizeStr, W - 28 * scale, 153 * scale);
  ctx.fillStyle = "#fff";
  ctx.fillText(sizeStr, W - 30 * scale, 150 * scale);

  ctx.restore();
}

let lastTime = 0;
function loop(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  if (running) {
    t += 0.08;
    update();
  }

  drawFlagBackground();

  for (const b of boilers) {
    if (b.active && boilerImg) {
      ctx.drawImage(boilerImg, b.x, b.y, CONFIG.BOILER_SIZE, CONFIG.BOILER_SIZE);
    }
  }

  if (pet.img) {
    const bob = Math.sin(t) * 6;
    ctx.drawImage(pet.img, pet.x, pet.y + bob, pet.size, pet.size);
  }

  drawUI();
  requestAnimationFrame(loop);
}

/* =========================================================
   СТАРТ
   ========================================================= */
async function startGame() {
  document.getElementById("startScreen").style.display = "none";

  // Показать мобильное управление
  if (isTouch) {
    joyEl.style.display = "block";
    document.getElementById("btnMusic").style.display = "flex";
    document.getElementById("hint").textContent = "Джойстик — движение, 🎵 — музыка";
  }

  try {
    petOriginal = await loadImage(CONFIG.IMG_PET);
    boilerImg   = await loadImage(CONFIG.IMG_BOILER);
    screamImg   = await loadImage(CONFIG.IMG_SCREAM).catch(() => null);

    pet.img = petOriginal;
    pet.size = CONFIG.PET_SIZE_BASE;
    pet.x = W / 2 - pet.size / 2;
    pet.y = H / 2 - pet.size / 2;

    initBoilers();

    // Звуки — инициализируются после клика/тапа, браузер разрешает
    music = new Audio(CONFIG.SND_MUSIC);
    music.loop = true;
    music.volume = 0.7;
    music.play().catch(e => console.warn("Музыка не запустилась:", e));

    screamSound = new Audio(CONFIG.SND_SCREAM);
    screamSound.volume = 1.0;
    screamSound.preload = "auto";

    score = 0;
    t = 0;
    startTime = performance.now();
    running = true;

    // Небольшой "разогрев" звука скримера на iOS (иначе не проиграет вовремя)
    if (isTouch && screamSound) {
      screamSound.volume = 0.01;
      screamSound.play().then(() => {
        screamSound.pause();
        screamSound.currentTime = 0;
        screamSound.volume = 1.0;
      }).catch(()=>{});
    }
  } catch (e) {
    alert("Ошибка загрузки ресурсов: " + e + "\nПроверь, что картинки и звуки лежат рядом с index.html");
    console.error(e);
  }
}

// На тач-устройствах — по тапу, на десктопе — по клику
document.getElementById("startScreen").addEventListener("click", startGame);
document.getElementById("startScreen").addEventListener("touchend", (e) => {
  e.preventDefault();
  startGame();
}, { passive: false });

requestAnimationFrame(loop);

/* Запрет скролла/зума на мобилке */
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("touchmove", e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
</script>
</body>
</html>
